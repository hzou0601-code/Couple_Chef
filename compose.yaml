services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: couplechef
      POSTGRES_USER: ${DB_USER:-couplechef}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or local .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d couplechef"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  inventory-data:
